<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - Hospital Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/signup.css">
</head>
<body>
<div class="container">
    <div class="image-section">
        <video autoplay muted loop playsinline id="background-video">
            <source src="/static/assets/Video_of_App_Login_Generated.mp4" type="video/mp4">
        </video>
    </div>
    <div class="form-section">
        <div class="form-wrapper">
            <h2>Create Your Account !!</h2>
            <form action="/signup" method="post">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="Enter your Email ID" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input  type="password"  name="password" placeholder="Create your Password"  required>
                </div>
                <div class="divider"><span>Or</span></div>
                <button type="submit" class="btn-primary">Create Account</button>
            </form>
            <div class="divider"><span>Or</span></div>
            <button type="button" class="btn-primary" onclick="window.location.href='/signup/doctor'">Signup as Doctor</button>
            <p class="footer-text">
                Already have an account? 
                <a href="/login">Login here</a>
            </p>
            <div class="alert-container">
                {% if success_msg %}
                <div class="alert alert-success alert-dismissible fade show auto-close" role="alert">
                    <strong>Success!</strong> {{ success_msg }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endif %}
                {% if error_msg %}
                <div class="alert alert-danger alert-dismissible fade show auto-close" role="alert">
                    <strong>Error!</strong> {{ error_msg }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const alerts = document.querySelectorAll('.auto-close');
    alerts.forEach(alert => {
        setTimeout(() => {
            const bsAlert = new bootstrap.Alert(alert);
            bsAlert.close();
        }, 3000); 
    });
});
</script>
</body>
</html>
