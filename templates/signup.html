<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/signup.css">
</head>
<body>
<div class="auth-container">
    <div class="auth-media">
        <video autoplay loop muted playsinline class="auth-video">
            <source src="/static/assets/Video_of_App_Login_Generated.mp4" type="video/mp4">
        </video>
    </div>
    <div class="auth-form-area">
        <div class="auth-card">
            <h2 class="auth-title">Create Account</h2>
            <form action="/signup" method="post">
                <div class="form-field">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="Enter your Email ID" required>
                </div>
                <div class="form-field">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter your Password" required>
                </div>
                <div class="form-field">
                    <label>Confirm Password</label>
                    <input type="password" name="confirm_password" placeholder="Re-enter Password" required>
                </div>
                <button type="submit" class="primary-btn">Signup</button>
            </form>
            <div class="separator">
                <span>Or</span>
            </div>
            <button class="primary-btn alt-btn"
                    onclick="window.location.href='/login/doctor'">
                Signup as Doctor
            </button>
            <div class="alert-box">
                {% if success_msg %}
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                     {{ success_msg }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endif %}
                {% if error_msg %}
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    {{ error_msg }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endif %}
            </div>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
