<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
<div class="login-page-container">
    <div class="login-video-section">
        <video autoplay loop muted playsinline class="bg-video">
            <source src="/static/assets/Video_of_App_Login_Generated.mp4" type="video/mp4">
        </video>
    </div>
    <div class="login-form-section">
        <div class="form-wrapper">
            <div class="alert-container">
                {% if success_msg %}
                <div class="alert alert-success alert-dismissible fade show auto-close" role="alert">
                    {{ success_msg }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endif %}
                {% if error_msg %}
                <div class="alert alert-danger alert-dismissible fade show auto-close" role="alert">
                    {{ error_msg }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endif %}
            </div>
            <h2 class="welcome-text">Welcome Back !!</h2>
            <form action="/login" method="post">
                <div class="input-group">
                    <label for="email">Your Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your Email ID" required>
                </div>     
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your Password" required>
                </div>
                <div class="divider">
                    <span>Or</span>
                </div>
                <button type="button" class="google-login-btn" onclick="window.location.href='/login/google'">
                    <img src="/static/assets/Google__G__logo.svg.webp" class="custom-image" alt="Google">
                    Continue with Google
                </button>
                <br>    
                <button type="submit" class="btn-primary continue-btn">Continue</button>
            </form>
            <div class="divider">
                <span>Or</span>
            </div>
            <button class="btn-primary continue-btn" onclick="window.location.href='/login/doctor'">Login as Doctor</button>
            <p class="terms-text">
                Don't have an account? <a href="/signup">Proceed here</a>
            </p>
            <br>
            <br>  
        </div>
    </div>
</div>
<script src="/static/js/login.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
