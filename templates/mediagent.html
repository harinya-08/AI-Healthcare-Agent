<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ask our AI anything</title>
  <link rel="stylesheet" href="static/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
</head>
<body>
  <div class="page-wrapper">
    <div id="alert-container"></div>
    <div class="hero-section" id="hero-section">
      <div class="ai-icon">
        <i class="fa-solid fa-sparkles"></i>
      </div>
      <h2 class="hero-title" id="title">How Can I Help You Today ?</h2>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="uploaded-files-bar" id="uploaded-files-bar"></div>
    <div class="chat-area">
      <input type="file" id="file-upload" class="hidden-file-input" />
      <div class="input-wrapper">
        <button type="button" class="plus-button" id="plus-btn">
          <i class="fa-solid fa-plus"></i>
        </button>
        <input type="text" class="chat-input" id="chat-input" placeholder="Ask about symptoms, medications, or general health advice..." autocomplete="off"/>
        <button type="button" class="send-button" id="send-btn">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="static/js/upload.js"></script>
  <script src="static/js/chat.js"></script>
</body>
</html>
